filetype: pascal

detect:
    filename: "\\.(dpr|inc|lpr|p|pas|pp)$"
    header: "unit|program"
    signature: "uses|interface|{\\$H"

# `//` is better than `{` `}` for line comments (Delphi/FPC).
comment: "//"

rules:
    ###### Types

    # We can try to get some types (custom included) by context.
    # `aType1 = [type|set of]? aType2;` (but its like a var comparison...)
    - type: "(?i)[\\w._]+\\s*=\\s*(type|set of)?\\s*[\\w._]+"
    # `aType1 = [class|object|record|specialize] [...]`
    - type: "(?i)[\\w._]+\\s*=\\s*(class|object|record|specialize)"
    # `(as|is|:) aType`
    - type: "(?i)(\\sas\\s|\\sis\\s|\\:)\\s*[\\w._]+"
    # Class heritance `class(TType)`
    - type: "(?i)class\\s*\\([\\w\\s._]+\\)"
    # Specializations `TType<aType>;`
    - type: "(?i)[\\w._]+\\s*<\\s*[\\w._]+\\s*>"
    # ToDo:
    #   - Castings: `TType(aVar)` wich is the same as a function call...

    ###### Keywords
    # Some keyword can have different meanings...

    ### Type names:
    #   ansistring|boolean|byte|cardinal|char|currency|extended|double|file
    #   int64|integer|longint|longword|real|single|shortint|shortstring
    #   string|widechar|widestring|word

    ### Types
    - statement: "(?i)\\b(array|class|generic|object|record|set)\\b"

    ### Program and unit sections:
    - identifier: "(?i)\\b(program|unit|uses|interface|implementation)\\b"
    - identifier: "(?i)\\b(initialization|finalization)\\b"
    - statement: "(?i)\\b(const|resourcestring|type|var)\\b"

    ### Function, procedure, contructor, etc.,  and code flow:
    - statement: "(?i)\\b(begin|break|case|constructor|continue|destructor)\\b"
    - statement: "(?i)\\b(do|downto|else|end|except|exit|finally|for)\\b"
    - statement: "(?i)\\b(function|goto|if|in|inherited|label|procedure|of)\\b"
    - statement: "(?i)\\b(operator|raise|repeat|result|then|to|try|until)\\b"
    - statement: "(?i)\\b(while|with)\\b"

    ### Constants
    # Self / Result
    - constant: "\\b(?i)(self|result)\\b"
    ### True / False / nil
    - constant.bool.true: "(?i)\\b(true)\\b"
    - constant.bool.false: "(?i)\\b(false|nil)\\b"

    ### Operator keywords (put with symbols.operator later)
    #  as|div|is|mod|not|or|shl|shr|xor

    ### Other keywords:
    - statement: "(?i)\\b(absolute|abstract|alias|assembler|cdecl|cppdecl)\\b"
    - statement: "(?i)\\b(constref|default|dispose|exports?|external|forward)\\b"
    - statement: "(?i)\\b(index|inline|library|local|name|new|nostackframe)\\b"
    - statement: "(?i)\\b(oldfpccall|out|override|pascal|packed|private|)\\b"
    - statement: "(?i)\\b(protected|property|public|published|read|register)\\b"
    - statement: "(?i)\\b(reintroduce|safecall|softfloat|specialize)\\b"
    - statement: "(?i)\\b(stdcall|hreadvar|virtual|write)\\b"

    ### Symbols
    - symbol: "[;.,@^]"

    ## Brackets
    - symbol.brackets: "[()\\[\\]]"

    ### Operators and operator keywords:
    - symbol.operator: "((?i)[-+*/:=<>]|\\b(as|div|is|mod|not|or|shl|shr|xor)\\b)"

    - special:
        start: "asm"
        end: "end"
    - constant.number: "\\$[0-9A-Fa-f]+"
    - constant.number: "\\b[+-]?[0-9]+([.]?[0-9]+)?(?i:e[+-]?[0-9]+)?"
    - constant.number:
        start: "#[0-9]{1,}"
        end: "$"
    - constant.string:
        start: "\""
        end: "\""
        rules:
            - constant.specialChar: "(?i)%[\\*|0-9|:|.]*[defgmnpsux]{1}"
    - constant.string:
        start: "'"
        end: "'"
    - preproc:
        start: "{\\$"
        end: "}"
    - comment:
        start: "//"
        end: "$"
        # rules: Copiar de { }
        rules:
            #
            # "FIX" what means: ¿Is already fixed or must be fixed?
            - underline: "\\b(?i)FIX\\s*:"
            - comment.bright: "\\b(?i)(TODO|FIXME|HACK|FIXED)\\s*:"
            # Simple PasDoc
            - comment.bright: "@\\w+"
            # "Simple" Markdown in PasDoc
            # Code, strong and italic
            - comment.bright: "`[^`]+`"
            - comment.bright: "(_[^ ][^_]*_|\\*[^ ][^*]*\\*)"
            - comment.bright: "(__[^ ][^_]*__|\\*\\*[^ ][^*]*\\*\\*)"
            - comment.bright: "\\*([^\\*]+)\\*"
            - comment.bright:
                start: "```"
                end: "```"
                rules:
                    # Restoring visible tabs inside code block
                    - indent-char: "^\\s*"

           # Restoring visible tabs inside comment block
            - indent-char: "^\\s*"
    - comment:
        start: "\\(\\*"
        end: "\\*\\)"
        # rules: Copiar de { }
        rules:
            #
            # "FIX" what means: ¿Is already fixed or must be fixed?
            - underline: "\\b(?i)FIX\\s*:"
            - comment.bright: "\\b(?i)(TODO|FIXME|HACK|FIXED)\\s*:"
            # Simple PasDoc
            - comment.bright: "@\\w+"
            # "Simple" Markdown in PasDoc
            # Code, strong and italic
            - comment.bright: "`[^`]+`"
            - comment.bright: "(_[^ ][^_]*_|\\*[^ ][^*]*\\*)"
            - comment.bright: "(__[^ ][^_]*__|\\*\\*[^ ][^*]*\\*\\*)"
            - comment.bright: "\\*([^\\*]+)\\*"
            - comment.bright:
                start: "```"
                end: "```"
                rules:
                    # Restoring visible tabs inside code block
                    - indent-char: "^\\s*"

            # Restoring visible tabs inside comment block
            - indent-char: "^\\s*"
    - comment:
        start: "{"
        end: "}"
        rules:
            #
            # "FIX" what means: ¿Is already fixed or must be fixed?
            - underline: "\\b(?i)FIX\\s*:"
            - comment.bright: "\\b(?i)(TODO|FIXME|HACK|FIXED)\\s*:"
            # Simple PasDoc
            - comment.bright: "@\\w+"
            # "Simple" Markdown in PasDoc
            # Code, strong and italic
            - comment.bright: "`[^`]+`"
            - comment.bright: "(_[^ ][^_]*_|\\*[^ ][^*]*\\*)"
            - comment.bright: "(__[^ ][^_]*__|\\*\\*[^ ][^*]*\\*\\*)"
            - comment.bright: "\\*([^\\*]+)\\*"
            - comment.bright:
                start: "```"
                end: "```"
                rules:
                    # Restoring visible tabs inside code block
                    - indent-char: "^\\s*"

           # Restoring visible tabs inside comment block
            - indent-char: "^\\s*"

